<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen Next · Keep here</title>
<style>
  :root {
    --cover-glass: rgba(0,0,0,.68); --cover-glass-hover: rgba(0,0,0,.85);
    --cover-edge: inset 0 0 0 1px rgba(255,255,255,.16); --cover-ring: 0 0 0 1.5px #fff;
    --cover-on: #fbbf24; --cover-on-hover: #fde68a; --cover-on-icon: #111;
    --grace: 10s;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(135deg,#1a1a1a,#2d2d2d) fixed; color: #eee;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .controls { padding: 16px 24px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
    background: #111; border-bottom: 1px solid #333; font-size: 13px; color: #aaa; }
  .controls button, .controls select { background: #222; color: #eee; border: 1px solid #444;
    border-radius: 6px; padding: 6px 10px; font: inherit; cursor: pointer; }
  .controls .seg button.on { background: var(--cover-on); color: #111; border-color: var(--cover-on); }
  h3 { margin: 28px 24px 4px; color: #888; font-weight: 500; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; }
  .note { margin: 0 24px 10px; color: #888; font-size: 13px; max-width: 760px; }

  .banner { background: linear-gradient(135deg,#9e76114d 0%,#e8991324 50%,#000 100%);
    border-bottom: 1px solid rgba(251,191,36,.1); padding: 20px 24px 14px; }
  .head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .head svg.star { width: 32px; height: 32px; color: #fbbf24; }
  .head h2 { color: #fbbf24; font-size: 1.75rem; margin: 0; text-shadow: 0 2px 8px rgba(251,191,36,.3); }
  .round { width: 36px; height: 36px; border-radius: 50%; border: 0; display: grid; place-items: center;
    background: var(--cover-glass); box-shadow: var(--cover-edge); color: #fff; cursor: pointer; }
  .round:hover { box-shadow: var(--cover-ring); }
  .round.on { background: var(--cover-on); color: var(--cover-on-icon); box-shadow: none; }
  .round svg { width: 18px; height: 18px; }
  .repeat { background: none; border: 0; color: #777; cursor: pointer; padding: 4px; display: grid; }
  .repeat.on { color: var(--cover-on); }
  .repeat svg { width: 18px; height: 18px; }

  .track { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 6px; }
  .card { flex: none; width: 180px; transition: width 250ms ease, margin 250ms ease; }
  .card.gone { width: 0; margin-right: -16px; }
  .cover { position: relative; width: 180px; height: 180px; border-radius: 12px; overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,.4); transition: opacity 350ms, transform 350ms; }
  .card.collapsing .cover { opacity: 0; transform: scale(.88); }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter 400ms, opacity 400ms; }
  .card .title { margin-top: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .artist { font-size: 12px; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card.leaving .title, .card.leaving .artist { opacity: .45; }

  .playing-dot { position: absolute; right: 8px; bottom: 8px; width: 28px; height: 28px; border-radius: 50%;
    background: var(--cover-on); display: grid; place-items: center; }
  .bars { display: flex; gap: 2px; align-items: flex-end; height: 12px; }
  .bars i { width: 3px; background: #111; animation: b 900ms ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: -300ms } .bars i:nth-child(3) { animation-delay: -600ms }
  @keyframes b { 0%,100% { height: 3px } 50% { height: 12px } }

  /* the leaving state, common */
  .leave-layer { position: absolute; inset: 0; display: none; }
  .card.leaving .leave-layer { display: block; }
  .played { position: absolute; top: 8px; left: 8px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 6px; border-radius: 4px;
    background: rgba(0,0,0,.72); box-shadow: var(--cover-edge); color: #f5f5f5; font-size: 10.5px; font-weight: 700;
    letter-spacing: .5px; text-transform: uppercase; }
  .tag svg { width: 12px; height: 12px; color: var(--cover-on); }
  @keyframes drain { from { transform: scaleX(1) } to { transform: scaleX(0) } }
  @keyframes drainRing { from { stroke-dashoffset: 0 } to { stroke-dashoffset: 113 } }
  @keyframes drainRingCw { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -113 } }

  /* A: dimmed, gold bar at the foot, pill in the middle */
  .vA.leaving img { filter: grayscale(.6) brightness(.45); }
  .vA .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.12); }
  .vA .bar::after { content: ""; position: absolute; inset: 0; background: var(--cover-on); transform-origin: left;
    animation: drain var(--grace) linear forwards; }
  .vA .keep { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    border: 0; border-radius: 999px; padding: 7px 14px; background: var(--cover-glass); box-shadow: var(--cover-edge);
    color: #fff; font: 600 13px/1 inherit; cursor: pointer; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .vA .keep:hover { box-shadow: var(--cover-ring); }
  .vA .keep svg { width: 14px; height: 14px; }

  /* B: dimmed, bar on the cover's lower edge, keep shown under the pointer only */
  .vB.leaving img { opacity: .35; }
  .vB .bar { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.18); overflow: hidden; }
  .vB .bar::after { content: ""; position: absolute; inset: 0; background: #fff; transform-origin: left; animation: drain var(--grace) linear forwards; }
  .vB .keep { position: absolute; inset: 0; border: 0; background: transparent; color: #fff; font: 600 13px inherit;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; opacity: 0; transition: opacity 150ms; }
  .vB .cover:hover .keep { opacity: 1; background: rgba(0,0,0,.35); }
  .vB .keep svg { width: 26px; height: 26px; }
  .vB .hint { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
    font-size: 12px; color: rgba(255,255,255,.75); pointer-events: none; transition: opacity 150ms; }
  .vB .cover:hover .hint { opacity: 0; }

  /* C: grayscale, round button with a draining ring */
  .vC.leaving img { filter: grayscale(1) brightness(.5); }
  .vC .keep { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 44px; height: 44px;
    border: 0; border-radius: 50%; background: var(--cover-glass); color: #fff; cursor: pointer; display: grid; place-items: center; }
  .vC .keep:hover { background: var(--cover-glass-hover); }
  .vC .keep svg.icon { width: 18px; height: 18px; }
  .vC .ring { position: absolute; inset: -4px; width: 52px; height: 52px; transform: rotate(-90deg); pointer-events: none; }
  .vC .ring circle { fill: none; stroke: var(--cover-on); stroke-width: 2.5; stroke-dasharray: 113; animation: drainRing var(--grace) linear forwards; }
  .banner[data-dir="cw"] .vC .ring circle { animation-name: drainRingCw; }
  .vC .ring .track-ring { stroke: rgba(255,255,255,.14); animation: none; stroke-dasharray: none; }
  .vC .label { position: absolute; left: 0; right: 0; top: calc(50% + 32px); text-align: center; font-size: 12px; color: #ddd; }

  .ov { position: absolute; transition: opacity 200ms; }
  .card.leaving .ov { opacity: 0; pointer-events: none; }
  .ov.x { top: 8px; right: 8px; } .ov.sh { top: 8px; right: 46px; } .ov.pl { right: 8px; bottom: 8px; }
  .ov.shelf { left: 8px; bottom: 8px; }
  .mini { width: 30px; height: 30px; border-radius: 50%; border: 0; display: grid; place-items: center;
    background: var(--cover-glass); box-shadow: var(--cover-edge); color: #fff; cursor: pointer; }
  .mini:hover { box-shadow: var(--cover-ring); } .mini svg { width: 15px; height: 15px; }
  .summary { text-align: right; color: #a8a29e; font-size: 12px; margin-top: 10px; font-variant-numeric: tabular-nums; }

  @media (prefers-reduced-motion: reduce) {
    .card, .cover, img { transition: none !important; }
  }
</style>
</head>
<body>
<div class="controls">
  <span>Durée du sursis</span>
  <span class="seg" id="grace">
    <button data-s="5">5 s</button><button data-s="10" class="on">10 s</button><button data-s="20">20 s</button><button data-s="60">60 s</button>
  </span>
  <button id="finish">▶ Simuler : l'album en cours se termine</button>
  <button id="reset">Recommencer</button>
</div>

<h3>C1 · l'anneau se vide dans le sens des aiguilles d'une montre</h3>
<p class="note">Le bord de l'anneau avance comme une aiguille, de midi vers midi ; le vide grandit derrière elle.</p>
<div class="banner" data-variant="vC" data-dir="cw"></div>

<h3>C2 · l'anneau se vide dans le sens inverse</h3>
<p class="note">L'anneau recule vers midi, comme un compte à rebours qui « se rembobine ».</p>
<div class="banner" data-variant="vC" data-dir="ccw"></div>

<script>
const ALBUMS = [
  { t: "A Kind of Magic", a: "Queen", f: "album_6a959ed9-178a-479f-a04f-45d7399c83d7_front_1792221962024.jpg", cds: 1, tracks: 9, min: 40 },
  { t: "Let’s Dance", a: "David Bowie", f: "album_e9f1653b-2082-3407-8d3c-9e00f3bf2ba8_front_1792221972322.jpg", cds: 1, tracks: 8, min: 40 },
  { t: "Symphony no. 9 “From The New World”", a: "Seiji Ozawa", f: "album_7f0b20a1-8df6-4a15-8ad7-1060e0588416_front_1792222098824.jpg", cds: 1, tracks: 4, min: 44 },
  { t: "Greatest Hits I, II & III", a: "Queen", f: "album_a9c51dd8-b55a-3aea-ba6f-11e62447e6fb_front_1792221948897.jpg", cds: 3, tracks: 51, min: 222 },
  { t: "Tales of Mystery and Imagination", a: "The Alan Parsons Project", f: "album_8481b8e0-1075-4bc2-bded-9adae4f7cbe2_front_1792222120261.jpg", cds: 1, tracks: 11, min: 42 },
];
const ICON = {
  star: '<svg class="star" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>',
  play: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M11.6 8.7 5.5 12.3c-.5.3-1.1 0-1.1-.6V4.3c0-.6.6-.9 1.1-.6l6.1 3.6c.5.3.5 1.1 0 1.4z"/></svg>',
  pause: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/></svg>',
  repeat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
  keep: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
};
let graceSec = 10;

function fmt(min) { const h = Math.floor(min / 60), m = min % 60; return h ? `~${h} h ${String(m).padStart(2, '0')}` : `~${m} min`; }

function build(banner) {
  const v = banner.dataset.variant;
  const st = { list: ALBUMS.map(a => ({ ...a })), playing: 0, repeat: false, on: true, timers: [] };
  banner._st = st;
  render(banner);
}

function leaveLayer(v) {
  if (v === 'vA') return `<div class="leave-layer"><span class="played tag">${ICON.check}Played</span>
      <button class="keep">${ICON.keep}Keep here</button><div class="bar"></div></div>`;
  if (v === 'vB') return `<div class="leave-layer"><span class="played tag">${ICON.check}Played</span>
      <div class="hint">Leaving Listen Next</div><button class="keep">${ICON.keep}Keep here</button><div class="bar"></div></div>`;
  return `<div class="leave-layer"><span class="played tag">${ICON.check}Played</span><button class="keep" title="Keep here">${ICON.keep.replace('<svg', '<svg class="icon"')}
      <svg class="ring" viewBox="0 0 40 40"><circle class="track-ring" cx="20" cy="20" r="18"/><circle cx="20" cy="20" r="18"/></svg></button><div class="label">Keep here</div></div>`;
}

function render(banner) {
  const st = banner._st, v = banner.dataset.variant;
  const shown = st.list.filter(a => !a.removed);
  const left = shown.filter(a => !a.leaving);
  const cds = left.reduce((s, a) => s + a.cds, 0), tracks = left.reduce((s, a) => s + a.tracks, 0), min = left.reduce((s, a) => s + a.min, 0);
  banner.innerHTML = `
    <div class="head">${ICON.star}<h2>Listen Next</h2>
      <button class="round ${st.on ? 'on' : ''}" title="Play Listen Next · ${left.length} albums">${st.on ? ICON.pause : ICON.play}</button>
      <button class="repeat ${st.repeat ? 'on' : ''}" title="${st.repeat ? 'Repeat: keep albums once played' : 'Albums leave the list once played'}">${ICON.repeat}</button>
    </div>
    <div class="track">${shown.map((a, i) => `
      <div class="card ${v} ${a.leaving ? 'leaving' : ''}" data-i="${st.list.indexOf(a)}">
        <div class="cover"><img src="${a.f}" alt="">
          ${st.list.indexOf(a) === st.playing && !a.leaving ? '<span class="playing-dot ov"><span class="bars"><i></i><i></i><i></i></span></span>' : ''}
          <button class="ov x mini" title="Remove">✕</button>
          <button class="ov sh mini" title="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
          ${st.list.indexOf(a) === st.playing ? '' : `<button class="ov pl mini" title="Play">${ICON.play}</button>`}
          <span class="ov shelf tag" style="color:var(--cover-on)">A-${3 + i}</span>
          ${leaveLayer(v)}
        </div>
        <div class="title">${a.t}</div><div class="artist">${a.a}</div>
      </div>`).join('')}</div>
    <div class="summary">${cds} CD${cds > 1 ? 's' : ''} · ${tracks} tracks · ${fmt(min)}${st.on ? ' left' : ''}</div>`;
  banner.querySelector('.round').onclick = () => { st.on = !st.on; render(banner); };
  banner.querySelector('.repeat').onclick = () => { st.repeat = !st.repeat; render(banner); };
  banner.querySelectorAll('.card.leaving .keep').forEach(btn => {
    btn.onclick = () => { const i = +btn.closest('.card').dataset.i; keep(banner, i); };
  });
}

function finish(banner) {
  const st = banner._st;
  const i = st.playing;
  const a = st.list[i];
  if (!a || a.removed || a.leaving) return;
  // the next album starts at once
  const next = st.list.findIndex((x, j) => j > i && !x.removed && !x.leaving);
  st.playing = next;
  if (st.repeat) { render(banner); return; }
  a.leaving = true;
  render(banner);
  a.timer = setTimeout(() => collapse(banner, i), graceSec * 1000);
}

function keep(banner, i) {
  const a = banner._st.list[i];
  clearTimeout(a.timer);
  a.leaving = false;
  render(banner);
}

function collapse(banner, i) {
  const card = banner.querySelector(`.card[data-i="${i}"]`);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const done = () => { banner._st.list[i].removed = true; render(banner); };
  if (!card || reduce) return done();
  card.classList.add('collapsing');
  setTimeout(() => { card.classList.add('gone'); setTimeout(done, 260); }, 350);
}

const banners = [...document.querySelectorAll('.banner')];
banners.forEach(build);
document.getElementById('finish').onclick = () => banners.forEach(finish);
document.getElementById('reset').onclick = () => banners.forEach(b => { b._st.list.forEach(a => clearTimeout(a.timer)); build(b); });
document.querySelectorAll('#grace button').forEach(b => b.onclick = () => {
  graceSec = +b.dataset.s;
  document.documentElement.style.setProperty('--grace', graceSec + 's');
  document.querySelectorAll('#grace button').forEach(x => x.classList.toggle('on', x === b));
});
</script>
</body>
</html>
