<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DexVault · Trouver un album</title>
<style>
  :root {
    --dv-gold: #fbbf24; --dv-gold-hover: #fcd34d; --dv-gold-ink: #111;
    --dv-gold-tint: rgba(251,191,36,.12); --dv-gold-tint-edge: rgba(251,191,36,.45);
    --dv-danger: #f87171; --dv-orange: #fb923c;
    --dv-text: #e5e5e5; --dv-text-muted: #9ca3af; --dv-text-faint: #8a8a8a;
    --dv-page: #1a1a1a;
    --dv-glass: rgba(255,255,255,.06); --dv-glass-hover: rgba(255,255,255,.11);
    --dv-edge: rgba(255,255,255,.12); --dv-edge-hover: rgba(255,255,255,.24);
    --dv-veil: rgba(255,255,255,.08);
    --dv-surface: rgba(24,24,24,.92); --dv-surface-edge: rgba(255,255,255,.1);
    --dv-surface-shadow: 0 16px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    --dv-ring: 0 0 0 3px rgba(251,191,36,.3);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--dv-page); color: var(--dv-text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button { font: inherit; }

  .proto { position: sticky; top: 0; z-index: 200; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    padding: 10px 16px; background: #0e0e0e; border-bottom: 1px solid #333; font-size: 13px; color: #aaa; }
  .proto b { color: #ddd; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid #444; border-radius: 8px; overflow: hidden; }
  .seg button { background: #222; color: #ddd; border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid #444; }
  .seg button.on { background: var(--dv-gold); color: #111; }
  .how { max-width: 1000px; margin: 14px auto 0; padding: 0 16px; color: #8a8a8a; font-size: 12.5px; }
  .how strong { color: #ccc; }

  .page { max-width: 1000px; margin: 0 auto; padding: 16px 16px 140px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid #333; padding-bottom: 14px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.8rem; font-weight: 600; }
  h1 small { font-size: .95rem; color: var(--dv-text-muted); font-weight: 400; margin-left: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dv-text-muted); padding: 8px; border-bottom: 1px solid #333; }
  td { padding: 8px; border-bottom: 1px solid #2a2a2a; vertical-align: middle; }
  td.muted { color: var(--dv-text-muted); }
  .thumb { width: 46px; height: 46px; border-radius: 3px; object-fit: cover; display: block; background: #333; }
  tr.fresh { animation: fresh 2.4s ease-out; }
  @keyframes fresh { 0%, 30% { background: var(--dv-gold-tint); } 100% { background: transparent; } }

  .btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px;
    border: 1px solid var(--dv-edge); background: var(--dv-glass); color: var(--dv-text); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--dv-glass-hover); border-color: var(--dv-edge-hover); }
  .btn svg { width: 16px; height: 16px; }
  .btn.primary { background: var(--dv-gold); border-color: var(--dv-gold); color: var(--dv-gold-ink); font-weight: 600; }
  .btn.primary:hover { background: var(--dv-gold-hover); }
  .btn.primary:disabled { opacity: .4; cursor: default; }
  .btn.quiet { background: none; border-color: transparent; color: var(--dv-text-muted); }
  .btn.quiet:hover { color: #fff; }
  .ib { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent;
    background: none; color: var(--dv-text-muted); cursor: pointer; flex: none; }
  .ib:hover { color: #fff; background: var(--dv-veil); }
  .ib svg { width: 16px; height: 16px; }
  .ib.on { color: var(--dv-gold); }

  .field { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 9px;
    border: 1px solid var(--dv-edge); background: #1f1f1f; }
  .field:focus-within { border-color: var(--dv-gold-tint-edge); box-shadow: var(--dv-ring); }
  .field svg { width: 16px; height: 16px; color: var(--dv-text-faint); flex: none; }
  .field input { flex: 1; min-width: 0; border: 0; background: none; color: var(--dv-text); font: inherit; font-size: 15px; outline: none; }
  .field.sm { height: 32px; } .field.sm input { font-size: 13px; }
  .field .hint { color: var(--dv-text-faint); font-size: 12px; white-space: nowrap; }

  .scrim { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center; padding: 7vh 16px 16px; }
  .scrim.open { display: flex; }
  .dialog { width: 760px; max-width: 100%; height: 80vh; display: flex; flex-direction: column; border-radius: 14px;
    background: #262626; border: 1px solid #3a3a3a; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden; }
  .dlg-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  .dlg-head h3 { margin: 0; font-size: 1.05rem; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .dlg-head h3 > svg { width: 18px; height: 18px; color: var(--dv-gold); flex: none; }
  .steps { display: flex; gap: 6px; color: var(--dv-text-faint); font-size: 12px; }
  .steps span.on { color: var(--dv-gold); }
  .dlg-top { padding: 0 16px 10px; }
  .dlg-body { padding: 0 16px 12px; overflow: auto; flex: 1; }
  .dlg-foot { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid #333; }
  .dlg-foot .note { flex: 1; color: var(--dv-text-faint); font-size: 12.5px; }

  .res { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 9px; cursor: pointer; }
  .res:hover, .res.active { background: var(--dv-veil); }
  .res img { width: 52px; height: 52px; border-radius: 4px; object-fit: cover; background: #333; flex: none; }
  .res .txt { flex: 1; min-width: 0; }
  .res .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .s { color: var(--dv-text-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .key { color: var(--dv-text-faint); font-size: 11px; border: 1px solid var(--dv-edge); border-radius: 5px; padding: 1px 5px; visibility: hidden; }
  .res.active .key { visibility: visible; }
  .res .go { color: var(--dv-text-faint); }
  .empty, .loading { color: var(--dv-text-faint); padding: 22px 8px; text-align: center; }
  .loading::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px;
    border: 2px solid #555; border-top-color: var(--dv-text-muted); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dv-text-faint); margin: 10px 0 6px 2px; }

  .tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 4px;
    background: rgba(0,0,0,.72); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); color: #bbb;
    font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; flex: none; }
  .tag.on { background: var(--dv-gold); color: var(--dv-gold-ink); box-shadow: none; }
  .tag.gold { color: var(--dv-gold); }
  .tag svg { width: 11px; height: 11px; stroke-width: 3; }

  /* Pastilles d'artistes */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px 0 4px; border-radius: 17px; cursor: pointer;
    border: 1px solid var(--dv-edge); background: var(--dv-glass); color: var(--dv-text); font-size: 13px; }
  .chip:hover { border-color: var(--dv-edge-hover); background: var(--dv-glass-hover); }
  .chip.on { border-color: var(--dv-gold-tint-edge); background: var(--dv-gold-tint); color: var(--dv-gold); }
  .chip .face { width: 26px; height: 26px; border-radius: 50%; background: #333 center/cover; flex: none; }
  .chip small { color: var(--dv-text-faint); }
  .chip .faces { display: inline-flex; padding-left: 2px; }
  .chip .faces img { width: 26px; height: 26px; border-radius: 4px; object-fit: cover; box-shadow: 0 0 0 2px #2b2b2b; }
  .chip .faces img + img { margin-left: -10px; }
  .chip.flat { padding: 0 12px; height: 28px; font-size: 12.5px; }
  .chip svg { width: 13px; height: 13px; }

  /* Discographie */
  .disco-head { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px; flex-wrap: wrap; }
  .disco-head b { font-size: 1.15rem; }
  .disco-head .n { color: var(--dv-text-muted); font-size: 13px; flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 14px; }
  .card { cursor: pointer; }
  .cover { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: #333; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s; }
  .card:hover .cover img { transform: scale(1.03); }
  .cover .tl { position: absolute; top: 6px; left: 6px; }
  .cbtn { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 0; cursor: pointer;
    background: rgba(0,0,0,.6); backdrop-filter: blur(6px); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); opacity: 0; transition: opacity .15s; }
  .cbtn svg { width: 15px; height: 15px; stroke-width: 2.5; }
  .card:hover .cbtn, .cbtn.on { opacity: 1; }
  .cbtn:hover { box-shadow: inset 0 0 0 2px #fff; }
  .cbtn.on { background: var(--dv-gold); color: var(--dv-gold-ink); box-shadow: none; }
  .card .t { margin-top: 6px; font-weight: 600; font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .s { color: var(--dv-text-muted); font-size: 12px; }

  /* Éditions */
  .album-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .album-head img { width: 72px; height: 72px; border-radius: 6px; object-fit: cover; }
  .album-head .t { font-weight: 600; font-size: 1.05rem; }
  .album-head .s { color: var(--dv-text-muted); font-size: 13px; }
  .ed-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .ed-tools .field { flex: 1; min-width: 220px; }
  .ed { display: grid; grid-template-columns: 20px 54px 1fr auto; gap: 12px; align-items: center; padding: 8px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; }
  .ed:hover { background: var(--dv-veil); }
  .ed.sel { background: var(--dv-gold-tint); border-color: var(--dv-gold-tint-edge); }
  .ed .dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid #666; display: grid; place-items: center; }
  .ed.sel .dot { border-color: var(--dv-gold); background: var(--dv-gold); box-shadow: inset 0 0 0 3px #2a2a2a; }
  .ed .pic { width: 54px; height: 54px; border-radius: 4px; object-fit: cover; background: #333; }
  .ed .pic.none { opacity: .25; filter: grayscale(1); }
  .ed .t { font-weight: 600; }
  .ed .t .cty { color: var(--dv-text-muted); font-weight: 400; }
  .ed .s { color: var(--dv-text-muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .ed .s mark { background: var(--dv-gold-tint); color: var(--dv-gold); border-radius: 3px; padding: 0 2px; }
  .ed .d { color: var(--dv-text-faint); font-size: 12px; font-style: italic; }
  .ed .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }

  .ed .sign { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .ed .sign .tag { height: 19px; }
  .ed .sign .note { color: var(--dv-text); font-size: 12.5px; font-style: normal; background: var(--dv-glass); border: 1px solid var(--dv-edge);
    border-radius: 4px; padding: 0 6px; line-height: 17px; }
  .ed .sign mark, .ed .sign .note mark { background: var(--dv-gold-tint); color: var(--dv-gold); }
  .drop { border: 1.5px dashed #555; border-radius: 12px; padding: 34px 16px; text-align: center; color: var(--dv-text-muted); cursor: pointer; }
  .drop:hover { border-color: var(--dv-gold-tint-edge); color: var(--dv-text); }
  .drop svg { width: 34px; height: 34px; display: block; margin: 0 auto 10px; color: var(--dv-text-faint); }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
  .form label { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--dv-text-muted); }
  .form label.wide { grid-column: 1 / -1; }
  .form .field { height: 36px; } .form .field input { font-size: 14px; }
  td .ib { width: 28px; height: 28px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 300; display: none; align-items: center; gap: 12px;
    padding: 9px 10px 9px 14px; border-radius: 10px; background: var(--dv-surface); border: 1px solid var(--dv-surface-edge);
    box-shadow: var(--dv-surface-shadow); font-size: 13px; backdrop-filter: blur(18px); }
  #toast .ok { color: var(--dv-gold); }
  #toast button { background: none; border: 0; color: var(--dv-gold); font-weight: 600; cursor: pointer; padding: 4px 6px; }

  @media (max-width: 640px) {
    .scrim { padding: 0; align-items: stretch; }
    .dialog { height: 100vh; border-radius: 0; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
    .hide-sm { display: none; }
    .ed { grid-template-columns: 20px 44px 1fr; } .ed .side { display: none; } .ed .pic { width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<div class="proto">
  <span><b>Ajouter</b></span>
  <div class="seg" id="modes">
    <button data-m="wish" class="on">À la wish list (un album)</button>
    <button data-m="cd">À la collection (un CD)</button>
  </div>
</div>
<p class="how" id="how"></p>

<div class="page">
  <div class="head">
    <h1 id="pageTitle">My Wish List <small id="count"></small></h1>
    <button class="btn" id="openBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg><span>Add Album</span></button>
  </div>
  <table>
    <thead><tr><th>Cover</th><th>Title</th><th>Artist</th><th class="hide-sm">Year</th><th class="hide-sm" id="col5">Format</th><th></th></tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>

<div class="scrim" id="scrim"><div class="dialog" id="dialog"></div></div>
<div id="toast"></div>

<script>
/* ---------- Petits outils ---------- */
const I = {
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  disc: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>', back: '<path d="m15 18-6-6 6-6"/>',
  next: '<path d="m9 18 6-6-6-6"/>', barcode: '<path d="M3 5v14M7 5v14M11 5v14M14 5v14M18 5v14M21 5v14"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  dollar: '<line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  filter: '<path d="M3 6h18M7 12h10M10 18h4"/>',
};
const svg = k => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- Ce qu'on a déjà ---------- */
const lists = {
  wish: [
    { title: 'Back in Black', artist: 'AC/DC', year: 1980 },
    { title: "L'Homme fleur", artist: 'Blankass', year: 2003 },
    { title: 'This Is the Life', artist: 'Amy Macdonald', year: 2007 },
  ],
  cd: [
    { title: 'A Curious Thing', artist: 'Amy Macdonald', year: 2010, edition: 'CD · DE · Vertigo 2723377' },
    { title: 'Highway to Hell', artist: 'AC/DC', year: 1979, edition: 'CD · EU · Epic 510763 2' },
    { title: 'OK Computer', artist: 'Radiohead', year: 1997, edition: 'CD · GB · Parlophone 7243 8 55229 2 5' },
  ],
};
const norm = s => String(s).toLowerCase()
  .replace(/\s*[\(\[][^\)\]]*(deluxe|edition|édition|remaster|version|anniversary|expanded|bonus|special|explicit)[^\)\]]*[\)\]]/gi, '')
  .replace(/\s+-\s+(single|ep)$/i, '').replace(/[’']/g, "'").replace(/[^\p{L}\p{N}' ]/gu, ' ').replace(/\s+/g, ' ').trim();
const key = a => norm(a.artist).replace(/^the /, '') + '|' + norm(a.title);
const statusOf = a => lists.wish.some(w => key(w) === key(a)) ? 'wished' : lists.cd.some(o => key(o) === key(a)) ? 'owned' : null;
const statusTag = a => { const s = statusOf(a);
  return s === 'wished' ? `<span class="tag ${mode === 'wish' ? 'on' : 'gold'}">${mode === 'wish' ? svg('check') : ''}Wished</span>`
    : s === 'owned' ? `<span class="tag ${mode === 'cd' ? 'on' : 'gold'}">${mode === 'cd' ? svg('check') : ''}Owned</span>` : ''; };

/* ---------- iTunes (JSONP : marche aussi depuis un fichier) ---------- */
const cache = new Map();
function itunes(params) {
  const url = 'https://itunes.apple.com/' + params + '&country=CH';
  if (!cache.has(url)) cache.set(url, new Promise((resolve, reject) => {
    const cb = 'it' + Math.random().toString(36).slice(2), s = document.createElement('script');
    window[cb] = j => { resolve(j.results || []); delete window[cb]; s.remove(); };
    s.onerror = () => { cache.delete(url); reject(new Error('iTunes unreachable')); };
    s.src = url + '&callback=' + cb; document.head.appendChild(s);
  }));
  return cache.get(url);
}
const art = (u, n = 300) => (u || '').replace(/\/\d+x\d+bb\./, `/${n}x${n}bb.`);
const toAlbum = r => ({ id: r.collectionId, title: r.collectionName.replace(/ - (Single|EP)$/, ''), artist: r.artistName, artistId: r.artistId,
  year: (r.releaseDate || '').slice(0, 4), tracks: r.trackCount, cover: art(r.artworkUrl100),
  single: / - (Single|EP)$/.test(r.collectionName) || r.trackCount < 5 });
function merge(albums) {
  const by = new Map();
  for (const a of albums) {
    const k = key(a), had = by.get(k);
    if (!had) { by.set(k, { ...a, editions: 1 }); continue; }
    had.editions++;
    const year = [had.year, a.year].filter(Boolean).sort()[0];
    if (a.title.length < had.title.length) Object.assign(had, { ...a, editions: had.editions });
    had.year = year;
  }
  return [...by.values()];
}
const searchAlbums = async q => merge((await itunes(`search?term=${encodeURIComponent(q)}&entity=album&limit=40`)).map(toAlbum).filter(a => !a.single));
// Les artistes dont le nom est dans ce qu'on tape, ou qui commencent par ce qu'on tape.
async function searchArtists(q) {
  const rows = await itunes(`search?term=${encodeURIComponent(q)}&entity=musicArtist&limit=10`);
  const nq = norm(q);
  return rows.map(r => ({ id: r.artistId, name: r.artistName, genre: r.primaryGenreName }))
    .filter(a => { const n = norm(a.name); return n.length > 1 && (nq.includes(n) || n.startsWith(nq)); });
}
const discography = async id => merge((await itunes(`lookup?id=${id}&entity=album&limit=200`)).filter(r => r.wrapperType === 'collection').map(toAlbum));

/* ---------- MusicBrainz : les éditions CD d'un album ---------- */
let mbLast = 0;
async function mb(path) {
  const gap = 1100 - (Date.now() - mbLast); if (gap > 0) await wait(gap);
  mbLast = Date.now();
  const r = await fetch('https://musicbrainz.org/ws/2/' + path + (path.includes('?') ? '&' : '?') + 'fmt=json');
  if (!r.ok) throw new Error('MusicBrainz ' + r.status);
  return r.json();
}
const q = s => '"' + String(s).replace(/["\\]/g, ' ') + '"';
async function cdEditions(album) {
  const t = norm(album.title) || album.title;
  let rg = (await mb(`release-group?query=${encodeURIComponent(`releasegroup:${q(t)} AND artist:${q(album.artist)} AND primarytype:album`)}&limit=5`))['release-groups'];
  if (!rg.length) rg = (await mb(`release-group?query=${encodeURIComponent(`${t} ${album.artist}`)}&limit=5`))['release-groups'];
  const group = rg[0]; if (!group) return { group: null, editions: [] };

    fresh = key(a); renderList(); close();
    toast(`<span class="ok">✓</span> ${esc(a.title)} ${bought ? 'bought: now in the collection' : 'added to the collection'}${e ? '' : ', its edition to set'}`, () => {
      const i = lists.cd.findIndex(w => key(w) === key(a)); if (i >= 0) lists.cd.splice(i, 1); renderList(); });
  },
};
function close() { document.getElementById('scrim').classList.remove('open'); }
document.getElementById('scrim').onmousedown = e => { if (e.target.id === 'scrim') close(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('scrim').classList.contains('open')) {
    if (F.view !== 'search') F.back(); else close();
  }
});
document.getElementById('openBtn').onclick = () => F.open();

/* ---------- Les deux modes ---------- */
const HOW = {
  wish: '<strong>À la wish list.</strong> Tape un artiste, un titre ou les deux : les albums arrivent pendant la frappe, et un clic (ou ↵) les ajoute, la fenêtre restant ouverte. Quand ce que tu tapes est un artiste, sa pastille apparaît au-dessus : elle ouvre sa discographie en pochettes, où chaque clic ajoute aussi. Esc revient en arrière, puis ferme.',
  cd: '<strong>À la collection.</strong> Le même chercheur, puis une étape de plus : choisir l\'édition. Elles viennent de MusicBrainz (en direct, d\'où une seconde d\'attente), Suisse et Europe d\'abord. Le plus rapide : taper le code-barres ou le n° de catalogue au dos du CD, la liste se réduit à mesure ; une seule restante est choisie d\'office. Essaie « Back in Black » puis 075678 ou SICP.',
};
function setMode(m) {
  mode = m; close();
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  document.getElementById('how').innerHTML = HOW[m] + ' <em>Recherche réelle (iTunes, MusicBrainz).</em>';
  document.getElementById('pageTitle').firstChild.textContent = m === 'wish' ? 'My Wish List ' : 'MusicDex ';
  document.getElementById('openBtn').querySelector('span').textContent = m === 'wish' ? 'Add Album' : 'Add CD';
  document.getElementById('col5').textContent = m === 'wish' ? 'Format' : 'Edition';
  renderList(); F.open();
}
document.getElementById('modes').onclick = e => { const b = e.target.closest('button'); if (b) setMode(b.dataset.m); };
setMode('wish');
</script>
