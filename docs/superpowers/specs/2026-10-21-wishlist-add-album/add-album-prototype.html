<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DexVault · Ajouter un album souhaité</title>
<style>
  :root {
    --dv-gold: #fbbf24; --dv-gold-hover: #fcd34d; --dv-gold-ink: #111;
    --dv-gold-tint: rgba(251,191,36,.12); --dv-gold-tint-edge: rgba(251,191,36,.45);
    --dv-danger: #f87171; --dv-orange: #fb923c;
    --dv-text: #e5e5e5; --dv-text-muted: #9ca3af; --dv-text-faint: #8a8a8a;
    --dv-page: #1a1a1a;
    --dv-glass: rgba(255,255,255,.06); --dv-glass-hover: rgba(255,255,255,.11);
    --dv-edge: rgba(255,255,255,.12); --dv-edge-hover: rgba(255,255,255,.24);
    --dv-veil: rgba(255,255,255,.08);
    --dv-surface: rgba(24,24,24,.92); --dv-surface-edge: rgba(255,255,255,.1);
    --dv-surface-shadow: 0 16px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.04);
    --dv-ring: 0 0 0 3px rgba(251,191,36,.3);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--dv-page); color: var(--dv-text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button { font: inherit; }

  /* Barre du prototype */
  .proto { position: sticky; top: 0; z-index: 200; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
    padding: 10px 16px; background: #0e0e0e; border-bottom: 1px solid #333; font-size: 13px; color: #aaa; }
  .proto b { color: #ddd; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid #444; border-radius: 8px; overflow: hidden; }
  .seg button { background: #222; color: #ddd; border: 0; padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid #444; }
  .seg button.on { background: var(--dv-gold); color: #111; }
  .how { max-width: 1000px; margin: 14px auto 0; padding: 0 16px; color: #8a8a8a; font-size: 12.5px; }
  .how strong { color: #ccc; }

  /* La page Wish List, en fond */
  .page { max-width: 1000px; margin: 0 auto; padding: 16px 16px 140px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid #333; padding-bottom: 14px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.8rem; font-weight: 600; }
  h1 small { font-size: .95rem; color: var(--dv-text-muted); font-weight: 400; margin-left: 8px; }
  .section { border: 1px solid #2c2c2c; border-radius: 12px; padding: 16px 18px; background: #1d1d1d; }
  .section-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  h2 { font-size: 1.25rem; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; flex: 1; }
  h2 svg { width: 20px; height: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--dv-text-muted); padding: 8px; border-bottom: 1px solid #333; }
  td { padding: 8px; border-bottom: 1px solid #2a2a2a; vertical-align: middle; }
  td.muted { color: var(--dv-text-muted); }
  .thumb { width: 46px; height: 46px; border-radius: 3px; object-fit: cover; display: block; background: #333; }
  tr.fresh { animation: fresh 2.4s ease-out; }
  @keyframes fresh { 0%, 30% { background: var(--dv-gold-tint); } 100% { background: transparent; } }

  /* Boutons (Button, IconButton) */
  .btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 9px;
    border: 1px solid var(--dv-edge); background: var(--dv-glass); color: var(--dv-text); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--dv-glass-hover); border-color: var(--dv-edge-hover); }
  .btn svg { width: 16px; height: 16px; }
  .btn.primary { background: var(--dv-gold); border-color: var(--dv-gold); color: var(--dv-gold-ink); font-weight: 600; }
  .btn.primary:hover { background: var(--dv-gold-hover); }
  .btn.primary:disabled { opacity: .4; cursor: default; }
  .btn.quiet { background: none; border-color: transparent; color: var(--dv-text-muted); }
  .btn.quiet:hover { color: #fff; }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; border-radius: 7px; }
  .ib { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent;
    background: none; color: var(--dv-text-muted); cursor: pointer; flex: none; }
  .ib:hover { color: #fff; background: var(--dv-veil); }
  .ib svg { width: 16px; height: 16px; }
  .ib.on { color: var(--dv-gold); }

  /* Champ (TextField) */
  .field { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 9px;
    border: 1px solid var(--dv-edge); background: #1f1f1f; }
  .field:focus-within { border-color: var(--dv-gold-tint-edge); box-shadow: var(--dv-ring); }
  .field svg { width: 16px; height: 16px; color: var(--dv-text-faint); flex: none; }
  .field input { flex: 1; min-width: 0; border: 0; background: none; color: var(--dv-text); font: inherit; font-size: 15px; outline: none; }
  .field.sm { height: 30px; font-size: 13px; }
  .field.sm input { font-size: 13px; }
  .field .hint { color: var(--dv-text-faint); font-size: 12px; white-space: nowrap; }

  /* Dialog */
  .scrim { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
  .scrim.open { display: flex; }
  .dialog { width: 640px; max-width: 100%; max-height: 84vh; display: flex; flex-direction: column; border-radius: 14px;
    background: #262626; border: 1px solid #3a3a3a; box-shadow: 0 30px 80px rgba(0,0,0,.6); overflow: hidden; }
  .dialog.wide { width: 860px; }
  .dlg-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  .dlg-head h3 { margin: 0; font-size: 1.05rem; font-weight: 600; flex: 1; display: flex; align-items: center; gap: 8px; }
  .dlg-head h3 svg { width: 18px; height: 18px; color: var(--dv-gold); }
  .dlg-body { padding: 0 16px 12px; overflow: auto; flex: 1; }
  .dlg-foot { display: flex; align-items: center; gap: 10px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid #333; }
  .dlg-foot .note { flex: 1; color: var(--dv-text-faint); font-size: 12.5px; }
  .sticky-field { position: sticky; top: 0; z-index: 2; background: #262626; padding-bottom: 10px; }

  /* Résultat en ligne */
  .res { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 9px; cursor: pointer; position: relative; }
  .res:hover, .res.active { background: var(--dv-veil); }
  .res img { width: 52px; height: 52px; border-radius: 4px; object-fit: cover; background: #333; flex: none; }
  .res .txt { flex: 1; min-width: 0; }
  .res .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .s { color: var(--dv-text-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .res .key { color: var(--dv-text-faint); font-size: 11px; border: 1px solid var(--dv-edge); border-radius: 5px; padding: 1px 5px; display: none; }
  .res.active .key { display: inline-block; }
  .res.added .t::after { content: ''; }
  .empty, .loading { color: var(--dv-text-faint); padding: 18px 8px; text-align: center; }

  /* Étiquettes (CoverTag) */
  .tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 4px;
    background: rgba(0,0,0,.72); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); color: #bbb;
    font-size: 10px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
  .tag.on { background: var(--dv-gold); color: var(--dv-gold-ink); box-shadow: none; }
  .tag.gold { color: var(--dv-gold); }
  .tag svg { width: 11px; height: 11px; stroke-width: 3; }

  /* Grille de pochettes */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 14px; }
  .card { cursor: pointer; }
  .cover { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: #333; }
  .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .2s, filter .2s; }
  .card:hover .cover img { transform: scale(1.03); }
  .cover .corner { position: absolute; top: 6px; right: 6px; }
  .cover .tl { position: absolute; top: 6px; left: 6px; }
  .cbtn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; border: 0; cursor: pointer;
    background: rgba(0,0,0,.6); backdrop-filter: blur(6px); color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); opacity: 0; transition: opacity .15s; }
  .cbtn svg { width: 15px; height: 15px; stroke-width: 2.5; }
  .card:hover .cbtn, .cbtn.on { opacity: 1; }
  .cbtn:hover { box-shadow: inset 0 0 0 2px #fff; }
  .cbtn.on { background: var(--dv-gold); color: var(--dv-gold-ink); box-shadow: none; }
  .card.picked .cover { box-shadow: 0 0 0 2px var(--dv-gold); }
  .card .t { margin-top: 6px; font-weight: 600; font-size: 13px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .s { color: var(--dv-text-muted); font-size: 12px; }

  /* Chips (artistes) */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 12px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; cursor: pointer;
    border: 1px solid var(--dv-edge); background: var(--dv-glass); color: var(--dv-text); font-size: 13px; }
  .chip:hover { border-color: var(--dv-edge-hover); }
  .chip.on { border-color: var(--dv-gold-tint-edge); background: var(--dv-gold-tint); color: var(--dv-gold); }
  .chip small { color: var(--dv-text-faint); }
  .filters { display: flex; gap: 6px; align-items: center; margin: 0 0 12px; color: var(--dv-text-faint); font-size: 12.5px; flex-wrap: wrap; }
  .artist-head { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 10px; }
  .artist-head b { font-size: 1.1rem; }
  .artist-head span { color: var(--dv-text-muted); font-size: 13px; }

  /* Menu sous un champ (menu-surface) */
  .anchor { position: relative; }
  .menu { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 50; padding: 4px; border-radius: 10px;
    border: 1px solid var(--dv-surface-edge); background: var(--dv-surface); box-shadow: var(--dv-surface-shadow);
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); max-height: 440px; overflow: auto; }
  .menu[hidden] { display: none; }
  .menu .res img { width: 40px; height: 40px; }
  .menu .foot { padding: 6px 8px 4px; border-top: 1px solid #333; margin-top: 4px; color: var(--dv-text-faint); font-size: 12px; display: flex; gap: 14px; }

  /* Liste collée */
  textarea { width: 100%; min-height: 150px; resize: vertical; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--dv-edge);
    background: #1f1f1f; color: var(--dv-text); font: 13.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; outline: none; }
  textarea:focus { border-color: var(--dv-gold-tint-edge); box-shadow: var(--dv-ring); }
  .line { display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-bottom: 1px solid #303030; }
  .line .src { width: 34%; color: var(--dv-text-faint); font-size: 12.5px; font-family: ui-monospace, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line img { width: 42px; height: 42px; border-radius: 4px; object-fit: cover; background: #333; flex: none; }
  .line .txt { flex: 1; min-width: 0; }
  .line .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line .s { color: var(--dv-text-muted); font-size: 12.5px; }
  .line.off { opacity: .4; }
  .line .alt { position: relative; }
  input[type=checkbox] { accent-color: var(--dv-gold); width: 16px; height: 16px; }

  /* Toast */
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 300; display: none; align-items: center; gap: 12px;
    padding: 9px 10px 9px 14px; border-radius: 10px; background: var(--dv-surface); border: 1px solid var(--dv-surface-edge);
    box-shadow: var(--dv-surface-shadow); font-size: 13px; backdrop-filter: blur(18px); }
  #toast .ok { color: var(--dv-gold); }
  #toast button { background: none; border: 0; color: var(--dv-gold); font-weight: 600; cursor: pointer; padding: 4px 6px; }

  @media (max-width: 640px) {
    .scrim { padding: 0; align-items: stretch; }
    .dialog { max-height: 100vh; border-radius: 0; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
    .line .src { display: none; }
    .hide-sm { display: none; }
  }
</style>
</head>
<body>

<div class="proto">
  <span><b>Prototype</b></span>
  <div class="seg" id="variants">
    <button data-v="A" class="on">A · Comme les films</button>
    <button data-v="B">B · Artiste d'abord</button>
    <button data-v="C">C · Sans fenêtre</button>
    <button data-v="D">D · Coller une liste</button>
  </div>
</div>
<p class="how" id="how"></p>

<div class="page">
  <div class="head">
    <h1>My Wish List <small id="count"></small></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn"><svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18M17 3v18M3 12h18"/></svg>Add Movie</button>
      <button class="btn" id="addAlbumBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>Add Album</button>
      <button class="btn"><svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>Add Book</button>
    </div>
  </div>

  <div class="section">
    <div class="section-head">
      <h2><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>Albums <span id="albumCount" style="color:var(--dv-text-muted);font-weight:400"></span></h2>
      <div class="anchor" id="inlineWrap" style="width:380px;max-width:100%" hidden>
        <label class="field sm"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <input id="inlineInput" placeholder="Add an album: artist, title…" autocomplete="off"><span class="hint hide-sm">⌘K</span></label>
        <div class="menu" id="inlineMenu" hidden></div>
      </div>
    </div>
    <table>
      <thead><tr><th>Cover</th><th>Title</th><th>Artist</th><th class="hide-sm">Year</th><th class="hide-sm">Format</th></tr></thead>
      <tbody id="wishBody"></tbody>
    </table>
  </div>
</div>

<div class="scrim" id="scrim"><div class="dialog" id="dialog"></div></div>
<div id="toast"></div>

<script>
/* ---------- Données ---------- */
const I = {
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  disc: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  chevron: '<path d="m6 9 6 6 6-6"/>',
};
const svg = k => `<svg viewBox="0 0 24 24">${I[k]}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// La wish list et la collection, pour marquer ce qu'on a déjà.
const wish = [
  { title: 'Back in Black', artist: 'AC/DC', year: 1980, cover: '' },
  { title: "L'Homme fleur", artist: 'Blankass', year: 2003, cover: '' },
  { title: 'This Is the Life', artist: 'Amy Macdonald', year: 2007, cover: '' },
  { title: 'Crush', artist: 'Bon Jovi', year: 2000, cover: '' },
];
const owned = [
  { title: 'A Curious Thing', artist: 'Amy Macdonald' },
  { title: 'Highway to Hell', artist: 'AC/DC' },
  { title: 'Abbey Road', artist: 'The Beatles' },
  { title: 'Rumours', artist: 'Fleetwood Mac' },
];

// Un titre sans ses éditions : « This Is the Life (Deluxe Edition) » est « This Is the Life ».
const norm = s => String(s).toLowerCase()
  .replace(/\s*[\(\[][^\)\]]*(deluxe|edition|édition|remaster|version|anniversary|expanded|bonus|special|explicit|live)[^\)\]]*[\)\]]/gi, '')
  .replace(/\s+-\s+(single|ep)$/i, '').replace(/[’']/g, "'").replace(/[^\p{L}\p{N}' ]/gu, ' ').replace(/\s+/g, ' ').trim();
const key = a => norm(a.artist).replace(/^the /, '') + '|' + norm(a.title);
const statusOf = a => wish.some(w => key(w) === key(a)) ? 'wished' : owned.some(o => key(o) === key(a)) ? 'owned' : null;

/* ---------- Recherche (iTunes Search API, en direct) ---------- */
const cache = new Map();
async function itunes(params) {
  const url = 'https://itunes.apple.com/' + params + '&country=CH';
  if (cache.has(url)) return cache.get(url);
  // JSONP: works from a file opened on disk as well as from a server.
  const p = new Promise((resolve, reject) => {
    const cb = 'it' + Math.random().toString(36).slice(2), s = document.createElement('script');
    window[cb] = j => { resolve(j.results || []); delete window[cb]; s.remove(); };
    s.onerror = () => { cache.delete(url); reject(new Error('iTunes unreachable')); };
    s.src = url + '&callback=' + cb; document.head.appendChild(s);
  });
  cache.set(url, p);
  return p;
}
const art = (u, n = 300) => (u || '').replace(/\/\d+x\d+bb\./, `/${n}x${n}bb.`);
function toAlbum(r) {
  const single = / - (Single|EP)$/.test(r.collectionName) || r.trackCount < 5;
  return { id: r.collectionId, title: r.collectionName.replace(/ - (Single|EP)$/, ''), artist: r.artistName,
    artistId: r.artistId, year: (r.releaseDate || '').slice(0, 4), tracks: r.trackCount, cover: art(r.artworkUrl100),
    single, explicit: r.collectionExplicitness === 'explicit' };
}
// Les éditions d'un même album n'en font qu'une : la plus ancienne, la plus courte de nom.
function merge(albums) {
  const by = new Map();
  for (const a of albums) {
    const k = key(a), had = by.get(k);
    if (!had) { by.set(k, { ...a, editions: 1 }); continue; }
    had.editions++;
    const year = [had.year, a.year].filter(Boolean).sort()[0];
    if (a.title.length < had.title.length) Object.assign(had, { ...a, editions: had.editions });
    had.year = year;
  }
  return [...by.values()];
}
async function searchAlbums(q, { singles = false } = {}) {
  const rows = await itunes(`search?term=${encodeURIComponent(q)}&entity=album&limit=40`);
  return merge(rows.map(toAlbum).filter(a => singles || !a.single));
}
async function searchArtists(q) {
  const rows = await itunes(`search?term=${encodeURIComponent(q)}&entity=musicArtist&limit=8`);
  return rows.map(r => ({ id: r.artistId, name: r.artistName, genre: r.primaryGenreName }));
}
async function discography(artistId) {
  const rows = await itunes(`lookup?id=${artistId}&entity=album&limit=200`);
  return merge(rows.filter(r => r.wrapperType === 'collection').map(toAlbum));
}
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

/* ---------- Ajouter, retirer ---------- */
let fresh = null;
function add(a, quiet) {
  if (statusOf(a) === 'wished') return false;
  wish.unshift({ title: a.title, artist: a.artist, year: a.year, cover: a.cover });
  fresh = key(a); renderWish();
  if (!quiet) toast(`<span class="ok">✓</span> ${esc(a.title)} · ${esc(a.artist)} added to the wish list`, () => { remove(a); rerender(); });
  return true;
}
function remove(a) {
  const i = wish.findIndex(w => key(w) === key(a));
  if (i >= 0) wish.splice(i, 1);
  renderWish();
}
let toastTimer;
function toast(html, undo) {
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${html}</span>` + (undo ? '<button>Undo</button>' : '');
  t.style.display = 'flex';
  if (undo) t.querySelector('button').onclick = () => { undo(); t.style.display = 'none'; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 6000);
}
function renderWish() {
  document.getElementById('wishBody').innerHTML = wish.map(w => `<tr class="${fresh === key(w) ? 'fresh' : ''}">
    <td>${w.cover ? `<img class="thumb" src="${art(w.cover, 100)}">` : '<div class="thumb"></div>'}</td>
    <td><strong>${esc(w.title)}</strong></td><td class="muted">${esc(w.artist)}</td>
    <td class="muted hide-sm">${w.year || ''}</td><td class="muted hide-sm">CD</td></tr>`).join('');
  document.getElementById('albumCount').textContent = `(${wish.length})`;
  document.getElementById('count').textContent = `(${wish.length + 6} items)`;
  fresh = null;
}
const statusTag = a => { const s = statusOf(a);
  return s === 'wished' ? `<span class="tag on">${svg('check')}Wished</span>` : s === 'owned' ? '<span class="tag gold">Owned</span>' : ''; };

/* ---------- A · Comme les films ---------- */
const A = {
  how: '<strong>A · Comme les films.</strong> Une fenêtre, un champ : tape un artiste, un titre, ou les deux. Les albums arrivent pendant la frappe, éditions fusionnées (Deluxe, Remaster…), singles masqués. Un clic ou ↵ ajoute ; la fenêtre reste ouverte pour en ajouter d\'autres. ↑ ↓ pour choisir, Esc pour fermer.',
  q: '', results: [], active: 0,
  open() {
    dialog(`<div class="dlg-head"><h3>${svg('disc')}Add an album to the wish list</h3><button class="ib" data-close>${svg('x')}</button></div>
      <div class="dlg-body"><div class="sticky-field"><label class="field">${svg('search')}<input id="aq" placeholder="Artist, album, or both: amy macdonald, back in black…" autocomplete="off"><span class="hint" id="acount"></span></label></div>
      <div id="ares"><div class="empty">Albums appear as you type.</div></div></div>
      <div class="dlg-foot"><span class="note">The CD itself (its pressing, its barcode) is chosen when you buy it.</span><button class="btn quiet" data-close>Done</button></div>`);
    const input = document.getElementById('aq');
    input.value = this.q; input.focus();
    const run = debounce(async q => {
      if (!q.trim()) { this.results = []; this.render(); return; }
      document.getElementById('acount').textContent = '…';
      const r = await searchAlbums(q);
      if (input.value !== q) return;
      this.results = r; this.active = 0; this.render();
    }, 220);
    input.oninput = () => { this.q = input.value; run(input.value); };
    input.onkeydown = e => {
      if (e.key === 'ArrowDown') { this.active = Math.min(this.active + 1, this.results.length - 1); this.render(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { this.active = Math.max(this.active - 1, 0); this.render(); e.preventDefault(); }
      if (e.key === 'Enter' && this.results[this.active]) { this.toggle(this.results[this.active]); }
    };
    if (this.q) run(this.q);
  },
  toggle(a) { if (statusOf(a) === 'wished') remove(a); else add(a); this.render(); },
  render() {
    const box = document.getElementById('ares'); if (!box) return;
    document.getElementById('acount').textContent = this.results.length ? `${this.results.length} albums` : '';
    if (!this.q.trim()) { box.innerHTML = '<div class="empty">Albums appear as you type.</div>'; return; }
    if (!this.results.length) { box.innerHTML = '<div class="empty">No album found.</div>'; return; }
    box.innerHTML = this.results.map((a, i) => `<div class="res ${i === this.active ? 'active' : ''}" data-i="${i}">
      <img src="${a.cover}" loading="lazy">
      <div class="txt"><div class="t">${esc(a.title)}</div><div class="s">${esc(a.artist)} · ${a.year} · ${a.tracks} tracks${a.editions > 1 ? ` · ${a.editions} editions` : ''}</div></div>
      ${statusTag(a)}<span class="key">↵</span>
      <button class="ib ${statusOf(a) === 'wished' ? 'on' : ''}" title="${statusOf(a) === 'wished' ? 'Remove from the wish list' : 'Add to the wish list'}">${svg(statusOf(a) === 'wished' ? 'check' : 'plus')}</button></div>`).join('');
    box.querySelectorAll('.res').forEach(el => el.onclick = () => { this.active = +el.dataset.i; this.toggle(this.results[this.active]); });
    box.querySelector('.res.active')?.scrollIntoView({ block: 'nearest' });
  },
};

/* ---------- B · Artiste d'abord ---------- */
const B = {
  how: '<strong>B · Artiste d\'abord.</strong> Tape un artiste, choisis-le parmi les pastilles : toute sa discographie s\'affiche en pochettes, par année, éditions fusionnées. Coche les albums voulus (ce que tu as déjà est marqué Owned ou Wished), puis un seul bouton les ajoute tous. Pratique pour « je veux les trois premiers de X ».',
  q: '', artists: [], artist: null, albums: [], picked: new Set(), kind: 'albums',
  open() {
    dialog(`<div class="dlg-head"><h3>${svg('disc')}Add albums to the wish list</h3><button class="ib" data-close>${svg('x')}</button></div>
      <div class="dlg-body"><div class="sticky-field"><label class="field">${svg('search')}<input id="bq" placeholder="An artist: AC/DC, Amy Macdonald, Karajan…" autocomplete="off"></label></div>
      <div id="bchips" class="chips"></div><div id="bres"><div class="empty">Choose an artist to see their albums.</div></div></div>
      <div class="dlg-foot"><span class="note" id="bnote"></span><button class="btn quiet" data-close>Cancel</button><button class="btn primary" id="badd" disabled>Add</button></div>`, true);
    const input = document.getElementById('bq');
    input.value = this.q; input.focus();
    const run = debounce(async q => {
      if (!q.trim()) { this.artists = []; this.renderChips(); return; }
      const r = await searchArtists(q);
      if (input.value !== q) return;
      this.artists = r; this.renderChips();
      if (r[0] && (!this.artist || this.artist.id !== r[0].id)) this.choose(r[0]);
    }, 260);
    input.oninput = () => { this.q = input.value; run(input.value); };
    document.getElementById('badd').onclick = () => {
      const list = this.albums.filter(a => this.picked.has(a.id));
      list.forEach(a => add(a, true));
      toast(`<span class="ok">✓</span> ${list.length} album${list.length > 1 ? 's' : ''} by ${esc(this.artist.name)} added`, () => { list.forEach(remove); });
      this.picked.clear(); closeDialog();
    };
    this.renderChips(); this.render();
  },
  async choose(artist) {
    this.artist = artist; this.picked.clear(); this.albums = []; this.renderChips();
    document.getElementById('bres').innerHTML = '<div class="loading">Loading the albums…</div>';
    const all = await discography(artist.id);
    if (this.artist !== artist) return;
    this.albums = all.filter(a => a.artistId === artist.id).sort((a, b) => a.year.localeCompare(b.year));
    this.render();
  },
  renderChips() {
    const el = document.getElementById('bchips'); if (!el) return;
    el.innerHTML = this.artists.map(a => `<span class="chip ${this.artist?.id === a.id ? 'on' : ''}" data-id="${a.id}">${esc(a.name)} <small>${esc(a.genre || '')}</small></span>`).join('');
    el.querySelectorAll('.chip').forEach(c => c.onclick = () => this.choose(this.artists.find(a => a.id == c.dataset.id)));
  },
  render() {
    const box = document.getElementById('bres'); if (!box || !this.artist) return;
    const shown = this.albums.filter(a => this.kind === 'all' || !a.single);
    box.innerHTML = `<div class="artist-head"><b>${esc(this.artist.name)}</b><span>${shown.length} ${this.kind === 'all' ? 'releases' : 'albums'}</span></div>
      <div class="filters"><span class="chip ${this.kind === 'albums' ? 'on' : ''}" data-k="albums">Albums</span><span class="chip ${this.kind === 'all' ? 'on' : ''}" data-k="all">With singles &amp; EPs</span></div>
      <div class="grid">${shown.map(a => { const s = statusOf(a), p = this.picked.has(a.id);
        return `<div class="card ${p ? 'picked' : ''}" data-id="${a.id}"><div class="cover"><img src="${a.cover}" loading="lazy">
          <div class="tl">${statusTag(a)}</div>
          ${s ? '' : `<button class="cbtn corner ${p ? 'on' : ''}" title="${p ? 'Unselect' : 'Select'}">${svg(p ? 'check' : 'plus')}</button>`}</div>
          <div class="t">${esc(a.title)}</div><div class="s">${a.year}${a.editions > 1 ? ` · ${a.editions} editions` : ''}</div></div>`; }).join('')}</div>`;
    box.querySelectorAll('.filters .chip').forEach(c => c.onclick = () => { this.kind = c.dataset.k; this.render(); });
    box.querySelectorAll('.card').forEach(c => c.onclick = () => {
      const a = this.albums.find(x => x.id == c.dataset.id); if (statusOf(a)) return;
      this.picked.has(a.id) ? this.picked.delete(a.id) : this.picked.add(a.id); this.render();
    });
    const n = this.picked.size, btn = document.getElementById('badd');
    btn.disabled = !n; btn.textContent = n ? `Add ${n} album${n > 1 ? 's' : ''}` : 'Add';
    document.getElementById('bnote').textContent = n ? '' : 'Click the covers you want.';
  },
};

/* ---------- C · Sans fenêtre ---------- */
const C = {
  how: '<strong>C · Sans fenêtre.</strong> Plus de bouton « Add Album » : un champ dans l\'en-tête de la section Albums (⌘K pour y aller). Les suggestions s\'ouvrent dessous, dans le verre des menus ; ↵ ajoute la première (ou celle choisie aux flèches), et l\'album apparaît en tête du tableau, surligné. Le champ se vide et reste prêt pour le suivant.',
  results: [], active: 0,
  mount() {
    const wrap = document.getElementById('inlineWrap'), input = document.getElementById('inlineInput'), menu = document.getElementById('inlineMenu');
    wrap.hidden = false;
    const run = debounce(async q => {
      if (!q.trim()) { menu.hidden = true; return; }
      const r = (await searchAlbums(q)).slice(0, 8);
      if (input.value !== q) return;
      this.results = r; this.active = 0; this.render();
    }, 200);
    input.oninput = () => run(input.value);
    input.onfocus = () => { if (input.value.trim() && this.results.length) menu.hidden = false; };
    input.onkeydown = e => {
      if (e.key === 'ArrowDown') { this.active = Math.min(this.active + 1, this.results.length - 1); this.render(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { this.active = Math.max(this.active - 1, 0); this.render(); e.preventDefault(); }
      if (e.key === 'Escape') { if (!menu.hidden) menu.hidden = true; else { input.value = ''; input.blur(); } }
      if (e.key === 'Enter' && this.results[this.active]) this.pick(this.results[this.active]);
    };
    document.addEventListener('mousedown', this.outside = e => { if (!wrap.contains(e.target)) menu.hidden = true; });
  },
  unmount() { document.getElementById('inlineWrap').hidden = true; document.getElementById('inlineMenu').hidden = true; document.removeEventListener('mousedown', this.outside); },
  pick(a) {
    const input = document.getElementById('inlineInput');
    if (statusOf(a) !== 'wished') add(a);
    input.value = ''; this.results = []; document.getElementById('inlineMenu').hidden = true; input.focus();
  },
  render() {
    const menu = document.getElementById('inlineMenu');
    menu.hidden = false;
    menu.innerHTML = (this.results.length ? this.results.map((a, i) => `<div class="res ${i === this.active ? 'active' : ''}" data-i="${i}">
        <img src="${a.cover}"><div class="txt"><div class="t">${esc(a.title)}</div><div class="s">${esc(a.artist)} · ${a.year}</div></div>${statusTag(a)}<span class="key">↵</span></div>`).join('')
      : '<div class="empty">No album found.</div>') + '<div class="foot"><span>↑ ↓ choose</span><span>↵ add</span><span>Esc close</span></div>';
    menu.querySelectorAll('.res').forEach(el => el.onmousedown = e => { e.preventDefault(); this.pick(this.results[+el.dataset.i]); });
  },
};

/* ---------- D · Coller une liste ---------- */
const D = {
  how: '<strong>D · Coller une liste.</strong> Pour les listes reçues (un article « 50 albums à avoir », un message d\'ami, une note) : colle une ligne par album, sous la forme que tu veux. Chaque ligne est résolue au meilleur résultat, avec sa pochette ; ▾ propose les autres candidats, la case écarte une ligne. Un seul bouton ajoute le tout.',
  text: "AC/DC - Highway to Hell\nAmy Macdonald, Under Stars\nThe Cure – Disintegration\nradiohead ok computer\nJean-Jacques Goldman Entre gris clair et gris foncé\nKarajan Beethoven symphonies 1963",
  lines: [],
  open() {
    dialog(`<div class="dlg-head"><h3>${svg('list')}Add a list of albums</h3><button class="ib" data-close>${svg('x')}</button></div>
      <div class="dlg-body"><textarea id="dtext" placeholder="One album per line: artist and title, in any form"></textarea>
      <div style="display:flex;justify-content:flex-end;margin:8px 0 6px"><button class="btn sm" id="dgo">${svg('search')}Find them</button></div>
      <div id="dres"></div></div>
      <div class="dlg-foot"><span class="note" id="dnote">Paste a list, then Find them.</span><button class="btn quiet" data-close>Cancel</button><button class="btn primary" id="dadd" disabled>Add</button></div>`, true);
    const ta = document.getElementById('dtext'); ta.value = this.text; ta.focus();
    ta.oninput = () => this.text = ta.value;
    document.getElementById('dgo').onclick = () => this.resolve();
    document.getElementById('dadd').onclick = () => {
      const list = this.lines.filter(l => l.on && l.pick && statusOf(l.pick) !== 'wished').map(l => l.pick);
      list.forEach(a => add(a, true));
      toast(`<span class="ok">✓</span> ${list.length} albums added to the wish list`, () => list.forEach(remove));
      closeDialog();
    };
    if (this.lines.length) this.render();
  },
  async resolve() {
    const src = this.text.split('\n').map(s => s.trim()).filter(Boolean);
    this.lines = src.map(s => ({ src: s, cands: null, pick: null, on: true }));
    this.render();
    await Promise.all(this.lines.map(async l => {
      const q = l.src.replace(/[–—,\-:]/g, ' ');
      l.cands = (await searchAlbums(q)).slice(0, 6); l.pick = l.cands[0] || null;
      if (l.pick && statusOf(l.pick)) l.on = false;
      this.render();
    }));
  },
  render() {
    const box = document.getElementById('dres'); if (!box) return;
    box.innerHTML = this.lines.map((l, i) => {
      const a = l.pick, s = a && statusOf(a);
      return `<div class="line ${l.on && a ? '' : 'off'}" data-i="${i}">
        <input type="checkbox" ${l.on && a ? 'checked' : ''} ${a && s !== 'wished' ? '' : 'disabled'}>
        <span class="src" title="${esc(l.src)}">${esc(l.src)}</span>
        ${l.cands === null ? '<span class="txt s">Searching…</span>' : !a ? '<span class="txt s">Nothing found: edit the line</span>'
          : `<img src="${art(a.cover, 100)}"><div class="txt"><div class="t">${esc(a.title)}</div><div class="s">${esc(a.artist)} · ${a.year}</div></div>${statusTag(a)}
             ${l.cands.length > 1 ? `<span class="alt"><button class="ib" title="Another album">${svg('chevron')}</button></span>` : ''}`}
      </div>`; }).join('');
    box.querySelectorAll('.line').forEach(el => {
      const l = this.lines[+el.dataset.i];
      el.querySelector('input').onchange = e => { l.on = e.target.checked; this.render(); };
      const b = el.querySelector('.alt button');
      if (b) b.onclick = () => this.menu(el.querySelector('.alt'), l);
    });
    const n = this.lines.filter(l => l.on && l.pick && statusOf(l.pick) !== 'wished').length, btn = document.getElementById('dadd');
    btn.disabled = !n; btn.textContent = n ? `Add ${n} albums` : 'Add';
    document.getElementById('dnote').textContent = this.lines.length ? `${this.lines.filter(l => l.cands).length} of ${this.lines.length} found` : 'Paste a list, then Find them.';
  },
  menu(anchor, l) {
    document.querySelectorAll('.alt .menu').forEach(m => m.remove());
    const m = document.createElement('div'); m.className = 'menu'; m.style.cssText = 'left:auto;right:0;width:340px';
    m.innerHTML = l.cands.map((a, j) => `<div class="res ${a === l.pick ? 'active' : ''}" data-j="${j}"><img src="${art(a.cover, 100)}"><div class="txt"><div class="t">${esc(a.title)}</div><div class="s">${esc(a.artist)} · ${a.year}</div></div></div>`).join('');
    anchor.appendChild(m);
    m.querySelectorAll('.res').forEach(r => r.onclick = e => { e.stopPropagation(); l.pick = l.cands[+r.dataset.j]; l.on = !statusOf(l.pick); this.render(); });
    setTimeout(() => document.addEventListener('click', function off() { m.remove(); document.removeEventListener('click', off); }), 0);
  },
};

/* ---------- Fenêtre ---------- */
function dialog(html, wide) {
  const d = document.getElementById('dialog');
  d.className = 'dialog' + (wide ? ' wide' : ''); d.innerHTML = html;
  document.getElementById('scrim').classList.add('open');
  d.querySelectorAll('[data-close]').forEach(b => b.onclick = closeDialog);
}
function closeDialog() { document.getElementById('scrim').classList.remove('open'); }
document.getElementById('scrim').onmousedown = e => { if (e.target.id === 'scrim') closeDialog(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('scrim').classList.contains('open')) closeDialog();
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); if (variant === 'C') document.getElementById('inlineInput').focus(); else V[variant].open(); }
});

/* ---------- Variantes ---------- */
const V = { A, B, C, D };
let variant = 'A';
function rerender() { if (document.getElementById('scrim').classList.contains('open')) V[variant].render?.(); }
function setVariant(v) {
  if (variant === 'C') C.unmount();
  variant = v; closeDialog();
  document.querySelectorAll('#variants button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  document.getElementById('how').innerHTML = V[v].how + ' <em>Recherche réelle (iTunes), essaie tes propres albums.</em>';
  const btn = document.getElementById('addAlbumBtn');
  btn.style.display = v === 'C' ? 'none' : '';
  btn.lastChild.textContent = v === 'D' ? 'Add Albums' : 'Add Album';
  if (v === 'C') { C.mount(); document.getElementById('inlineInput').focus(); } else V[v].open();
}
document.getElementById('variants').onclick = e => { const b = e.target.closest('button'); if (b) setVariant(b.dataset.v); };
document.getElementById('addAlbumBtn').onclick = () => V[variant].open();

renderWish();
setVariant('A');
</script>
</body>
</html>
