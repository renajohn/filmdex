# A two-disc set, tracks printed in two columns under "CD 1" and "CD 2".
# Multi-disc is where a transcription most easily goes wrong: the numbering
# restarts, so without reading the headings the second disc overwrites the
# first.
image: synthetic-back-2cd.jpg

